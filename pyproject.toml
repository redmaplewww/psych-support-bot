[project]
name = "psych-support-bot"
version = "0.1.0"
description = "AI psychological support bot backend"
authors = [
    { name = "redmaplewww", email = "610723892@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "celery>=5.6.3",
    "fastapi>=0.135.3",
    "langchain-core>=1.3.3",
    "langchain-openai>=1.1.14",
    "langfuse>=4.1.0",
    "langgraph>=1.1.6",
    "pgvector>=0.4.2",
    "pypdf>=6.19.0",
    "psycopg[binary]>=3.3.3",
    "pydantic-settings>=2.14.2",
    "pytest>=9.0.3",
    "python-dotenv>=1.2.2",
    "redis>=7.4.0",
    "sqlalchemy>=2.0.49",
    "uvicorn[standard]>=0.44.0",
    "pyjwt>=2.15.0",
    "python-multipart>=0.0.32",
    "python-socks[asyncio]>=3.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "ruff>=0.6.0",
]

[project.scripts]
psych-support-bot = "psych_support_bot.main:main"
psych-support-bot-evals = "psych_support_bot.evals.runner:main"
psych-support-bot-ingest-knowledge = "psych_support_bot.knowledge_ingestion:main"

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "privacy_boundary: exercises real consent and erasure boundaries without legacy fixture overrides",
    "slow: marks tests as slow (deselect with '-k \"not slow\"')",
]

[tool.ruff]
line-length = 120
