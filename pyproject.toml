[project]
name = "psych-support-bot"
version = "0.1.0"
description = "AI psychological support bot backend"
authors = [
    { name = "redmaplewww", email = "610723892@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "celery>=5.6.3",
    "fastapi>=0.135.3",
    "langchain-core>=1.2.28",
    "langchain-openai>=1.1.12",
    "langfuse>=4.1.0",
    "langgraph>=1.1.6",
    "pgvector>=0.4.2",
    "pypdf>=5.9.0",
    "psycopg[binary]>=3.3.3",
    "pydantic-settings>=2.13.1",
    "pytest>=9.0.3",
    "python-dotenv>=1.2.2",
    "redis>=7.4.0",
    "sqlalchemy>=2.0.49",
    "uvicorn[standard]>=0.44.0",
    "pyjwt>=2.13.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "ruff>=0.6.0",
]

[project.scripts]
psych-support-bot = "psych_support_bot.main:main"
psych-support-bot-evals = "psych_support_bot.evals.runner:main"
psych-support-bot-judge = "psych_support_bot.evals.judge:main"
psych-support-bot-ingest-knowledge = "psych_support_bot.knowledge_ingestion:main"

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-k \"not slow\"')",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "W", "I", "UP", "B", "SIM", "C4", "DTZ", "BLE", "RUF"]
ignore = [
    "RUF001", # Chinese quote characters in string literals
    "RUF002", # Chinese quote characters in docstrings
    "RUF003", # Chinese quote characters in comments
    "E501",   # Line too long (many Chinese strings exceed 100 chars)
    "B008",   # FastAPI Depends()/Query() in defaults is standard
]

[tool.ruff.lint.per-file-ignores]
"src/psych_support_bot/knowledge_ingestion.py" = ["BLE001"]
"src/psych_support_bot/infra/telemetry/tracing.py" = ["BLE001"]
