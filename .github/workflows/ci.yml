name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Ruff check
        run: uv run ruff check src/ tests/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run migrations
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: sqlite:///./data/test.db

      - name: Run unit tests
        run: uv run pytest tests/unit/ -v --tb=short
        env:
          DATABASE_URL: sqlite:///./data/test.db

  frontend:
    name: Frontend Module Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 语音前端模块（static/js/voice/）的特征测试：协议常量↔服务端 schema
      # 交叉校验、PCM 排程、live 状态机、分句双端 fixture 一致性。
      - name: Run frontend module tests
        run: node --test tests/frontend/*.test.mjs

  check-secrets:
    name: Secret Availability
    runs-on: ubuntu-latest
    outputs:
      has_openai_key: ${{ steps.check.outputs.has_openai_key }}
    steps:
      - id: check
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: echo "has_openai_key=$([ -n "$OPENAI_KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  evals:
    name: End-to-End Evaluation Tests
    runs-on: ubuntu-latest
    needs: check-secrets
    # Only run evals when OPENAI_API_KEY is available (secrets or env)
    # This ensures LLM-dependent tests are skipped in forks without keys.
    # NOTE: secrets 上下文不能直接用于 job 级 if（会导致 workflow 解析失败、
    # 全部 job 0 秒 startup failure），须先经 check-secrets 间接暴露。
    if: needs.check-secrets.outputs.has_openai_key == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run migrations
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: sqlite:///./data/test.db

      - name: Run end-to-end eval tests
        run: uv run pytest tests/evals/ -v --tb=short -x
        env:
          DATABASE_URL: sqlite:///./data/test.db
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}

  secrets-check:
    name: Secret Leak Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for .env file
        run: |
          if git diff --name-only ${{ github.event.before }}...HEAD 2>/dev/null | grep -E "^\.env$"; then
            echo "::error::.env file detected in commit!"
            exit 1
          fi
