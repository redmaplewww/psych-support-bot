services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: psych-bot
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////app/data/psych_support_bot.db
      ENVIRONMENT: production
      APP_DEBUG: "false"
    volumes:
      - bot-data:/app/data
      - bot-logs:/app/logs
volumes:
  bot-data:
  bot-logs:
