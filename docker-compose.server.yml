services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: psych-bot
    restart: unless-stopped
    ports:
      - "${PSYCHBOT_PORT:-9958}:8000"
    # 整体透传 .env（OPENAI_*/VOICE_STT_*/VOICE_TTS_*/LANGFUSE_*/AUTH_* 等
    # 全部随 .env 自动进入容器，新增变量无需再改本文件）。
    env_file:
      - .env
    environment:
      # 容器内固定项：覆盖 .env 里的本地开发默认值
      - DATABASE_URL=sqlite:////app/data/psych_support_bot.db
      - ENVIRONMENT=production
      - APP_DEBUG=false
    volumes:
      - bot-data:/app/data
      - bot-logs:/app/logs

volumes:
  bot-data:
  bot-logs:
